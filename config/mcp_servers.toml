# M4 generic MCP runtime configuration.
#
# Servers are disabled by default. Runtime tools accept only names declared in
# this file; the model cannot submit an arbitrary command or URL. Put secret
# values in .env and reference the environment-variable name here.

[servers.exa]
transport = "streamable_http"
enabled = true
url = "https://mcp.exa.ai/mcp"
connect_timeout = 20
call_timeout = 30

# Exa's public MCP endpoint currently works without authentication. If Exa
# later requires a key, keep the value in .env and reference its name here:
# [servers.exa.header_refs]
# Authorization = "EXA_AUTHORIZATION"

# M9 local controlled proactive Source server. It is disabled by default and
# intended for development/integration tests before real providers are added.
[servers.proactive_demo]
transport = "stdio"
enabled = false
command = "python3"
args = ["tests/fixtures/mcp_proactive_server.py"]
connect_timeout = 20
call_timeout = 30

