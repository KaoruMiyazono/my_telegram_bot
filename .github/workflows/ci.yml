name: CI

on:
  push:
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    env:
      TG_BOT_TOKEN: test_token
      DEEPSEEK_API_KEY: test_key
      ALIYUN_DASHSCOPE_API_KEY: test_key
      DEEPSEEK_BASE_URL: https://api.test.com
      LLM_MODEL: test-model
      DATABASE_PATH: /tmp/telegram-bot-mvp-ci.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-ansi
          poetry run pip install -r requirements-dev.txt

      - name: Syntax check
        run: |
          poetry run python -m py_compile \
            agent/pipeline/invalidation_worker.py \
            agent/pipeline/consolidation_worker.py \
            agent/pipeline/passive_turn.py \
            agent/pipeline/reasoner.py \
            agent/core/envelope.py \
            agent/core/message_bus.py \
            agent/core/session_lane.py \
            agent/runtime/turn_runtime.py \
            agent/runtime/cancellation.py \
            agent/runtime/mode_coordinator.py \
            agent/runtime/idle_tasks.py \
            agent/runtime/stream_events.py \
            channels/base.py \
            channels/cli_adapter.py \
            channels/web_gateway.py \
            agent/tools/web_search.py \
            agent/tools/web_fetch.py \
            agent/tools/web.py \
            proactive_v2/contracts.py \
            proactive_v2/stages.py \
            proactive_v2/state.py \
            proactive_v2/agent_tick.py \
            proactive_v2/loop.py \
            proactive_v2/mcp_sources.py \
            proactive_v2/interests.py \
            proactive_v2/scheduler.py \
            memory/store.py \
            persistence/session_store.py \
            main.py

      - name: Pyright core contracts
        id: pyright
        continue-on-error: true
        run: poetry run pyright

      - name: Unified pytest suite
        id: pytest
        continue-on-error: true
        run: poetry run pytest --junitxml=data/evaluation/test-archive/junit.xml

      - name: RAG lifecycle smoke
        id: rag
        continue-on-error: true
        run: poetry run python eval/rag_layer_smoke.py

      - name: Build M13 test archive
        if: always() && hashFiles('data/evaluation/test-archive/junit.xml') != ''
        run: |
          poetry run python -m evaluation.test_archive build \
            --junit data/evaluation/test-archive/junit.xml \
            --scenario-config config/quality_scenarios.toml \
            --output-dir data/evaluation/test-archive \
            --pytest-status "${{ steps.pytest.outcome }}" \
            --pyright-status "${{ steps.pyright.outcome }}" \
            --rag-status "${{ steps.rag.outcome }}" \
            --commit-sha "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --run-id "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Upload M13 test archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m13-test-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/evaluation/test-archive/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce archived quality gate
        if: always()
        run: poetry run python -m evaluation.test_archive verify data/evaluation/test-archive/latest.json
